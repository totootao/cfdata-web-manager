name: Build 多平台二进制

# 为尽可能多的平台编译单文件可执行程序(PyInstaller 打包 app.py, 内嵌 web 界面;
# 主流平台同时内嵌官方同架构 cfdata 二进制, 开箱即用)。
# 另产出通用 zipapp(.pyz), 任何装有 Python 3.8+ 的平台均可直接运行。
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      self_sign:
        description: '无正式证书时, 用自签名证书为 Windows 产物签名(仅消除"未签名"标记, 不能消除 SmartScreen 警告)'
        type: boolean
        default: false

concurrency:
  group: build-binaries
  cancel-in-progress: false

permissions:
  contents: write

env:
  APP_NAME: cfdata-web-manager
  # 官方 cfdata 多平台二进制来源(构建时按目标平台捆绑)
  CFDATA_REPO: PoemMisty/CFData-WEB
  PYTHON_VERSION: '3.12'
  # ---- 代码签名: 配置对应 secrets 后自动启用; 未配置则整段跳过, 构建不受影响 ----
  HAS_MACOS_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
  HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
  HAS_WINDOWS_CERT: ${{ secrets.WINDOWS_CERTIFICATE != '' }}
  HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
  WINDOWS_TIMESTAMP_URL: http://timestamp.digicert.com

jobs:
  # ---------- 主力矩阵: 原生 runner + PyInstaller(PyInstaller 不支持交叉编译, 故按原生平台分组) ----------
  build:
    name: 构建 ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ===== 主流平台(必过) =====
          - target: linux-amd64        # Linux x86_64 (绝大多数 VPS/服务器)
            runs-on: ubuntu-latest
            python-arch: x64
            cfdata: cfdata-linux-amd64
          - target: linux-arm64        # Linux ARM64 (ARM 云服务器/NAS/树莓派4+)
            runs-on: ubuntu-24.04-arm
            python-arch: arm64
            cfdata: cfdata-linux-arm64
          - target: macos-amd64        # macOS Intel (x64 Python 经 Rosetta 构建)
            runs-on: macos-15
            python-arch: x64
            cfdata: cfdata-darwin-amd64
          - target: macos-arm64        # macOS Apple Silicon (M1/M2/M3/M4)
            runs-on: macos-15
            python-arch: arm64
            cfdata: cfdata-darwin-arm64
          - target: windows-amd64      # Windows x64
            runs-on: windows-latest
            python-arch: x64
            cfdata: cfdata-windows-amd64.exe
          - target: windows-x86        # Windows 32位 (老机器兼容)
            runs-on: windows-latest
            python-arch: x86
            cfdata: ''
          # ===== 扩展平台(实验性, 失败不影响整体发布) =====
          - target: windows-arm64      # Windows on ARM (Surface/骁龙笔记本)
            runs-on: windows-11-arm
            python-arch: arm64
            cfdata: cfdata-windows-arm64.exe
            experimental: true
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python (${{ matrix.python-arch }})
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.python-arch }}

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: 下载官方 cfdata (${{ matrix.cfdata }})
        if: matrix.cfdata != ''
        shell: bash
        run: |
          mkdir -p bundle
          if [ "${{ runner.os }}" = "Windows" ]; then DEST="bundle/cfdata.exe"; else DEST="bundle/cfdata"; fi
          curl -fsSL --retry 3 -o "$DEST" \
            "https://github.com/${CFDATA_REPO}/releases/latest/download/${{ matrix.cfdata }}"
          chmod +x "$DEST" 2>/dev/null || true
          ls -la bundle/

      - name: 导入 macOS 签名证书
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true'
        run: |
          KEYCHAIN="$RUNNER_TEMP/app-signing.keychain-db"
          KC_PASSWORD="$(openssl rand -base64 24)"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "KC_PASSWORD=$KC_PASSWORD" >> "$GITHUB_ENV"
          echo -n "${{ secrets.MACOS_CERTIFICATE }}" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
                     | awk -F'"' '/Developer ID Application/ {print $2; exit}')
          [ -n "$IDENTITY" ] || IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
                     | awk -F'"' 'NR==1 {print $2}')
          echo "MACOS_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "签名身份: $IDENTITY"

      - name: 签名内嵌 cfdata (macOS)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true'
        run: |
          [ -f bundle/cfdata ] || exit 0
          # 单文件模式下 cfdata 会解压到临时目录后执行, 必须先签名, 否则 Gatekeeper 会拦截子进程
          codesign --force --sign "$MACOS_IDENTITY" --options runtime --timestamp bundle/cfdata
          codesign --verify --verbose=2 bundle/cfdata

      - name: PyInstaller 打包 (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="${APP_NAME}-${{ matrix.target }}"
          args=(--onefile --clean --noconfirm --name "$name" --add-data "web:web")
          if [ -f bundle/cfdata ]; then args+=(--add-binary "bundle/cfdata:."); fi
          python -m PyInstaller "${args[@]}" app.py

      - name: PyInstaller 打包 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "${{ env.APP_NAME }}-${{ matrix.target }}"
          $pyArgs = @('--onefile','--clean','--noconfirm','--name', $name, '--add-data', 'web;web')
          if (Test-Path 'bundle/cfdata.exe') { $pyArgs += @('--add-binary', 'bundle/cfdata.exe;.') }
          python -m PyInstaller @pyArgs app.py

      - name: 冒烟测试 (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./dist/${APP_NAME}-${{ matrix.target }} --help > /dev/null && echo "冒烟测试通过"

      - name: 冒烟测试 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = "dist/${{ env.APP_NAME }}-${{ matrix.target }}.exe"
          $out = & $exe --help 2>&1 | Out-String
          Write-Host $out
          if ($LASTEXITCODE -ne 0) { throw "冒烟测试失败 (退出码 $LASTEXITCODE)" }
          Write-Host "冒烟测试通过"

      - name: 签名可执行文件 (macOS)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true'
        run: |
          cat > entitlements.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-jit</key><true/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><true/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
          </dict>
          </plist>
          PLIST
          BIN="dist/${APP_NAME}-${{ matrix.target }}"
          codesign --force --sign "$MACOS_IDENTITY" --options runtime --timestamp \
            --entitlements entitlements.plist "$BIN"
          codesign --verify --verbose=2 "$BIN"

      - name: 签名可执行文件 (Windows)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT == 'true'
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String("${{ secrets.WINDOWS_CERTIFICATE }}"))
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe `
                       | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1).FullName
          if (-not $signtool) {
            # ARM64 runner 上可能只装了 arm64 版 signtool
            $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe `
                         | Select-Object -First 1).FullName
          }
          if (-not $signtool) { throw "未找到 signtool.exe" }
          $exe = "dist\${{ env.APP_NAME }}-${{ matrix.target }}.exe"
          & $signtool sign /fd SHA256 /td SHA256 /tr "${{ env.WINDOWS_TIMESTAMP_URL }}" `
            /f $pfx /p "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" /v $exe
          if ($LASTEXITCODE -ne 0) { throw "Authenticode 签名失败" }
          & $signtool verify /pa /v $exe
          if ($LASTEXITCODE -ne 0) {
            # 签名已写入, verify 多半因本机信任链/中间证书缺失而失败, 不阻断发布
            Write-Host "::warning::signtool verify 未通过(签名已写入), 请检查证书链是否完整"
            # runner 在脚本末尾会 exit $LASTEXITCODE, 不清零会让整个步骤失败
            $global:LASTEXITCODE = 0
          }

      - name: 自签名 (Windows, 无正式证书时)
        if: runner.os == 'Windows' && env.HAS_WINDOWS_CERT != 'true' && inputs.self_sign
        shell: pwsh
        run: |
          New-SelfSignedCertificate -Subject "CN=cfdata-web-manager (self-signed)" `
            -CertStoreLocation Cert:\CurrentUser\My -Type CodeSigningCert `
            -HashAlgorithm SHA256 -KeyLength 2048 -NotAfter (Get-Date).AddYears(10) | Out-Null
          $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe `
                       | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1).FullName
          if (-not $signtool) {
            # ARM64 runner 上可能只装了 arm64 版 signtool
            $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe `
                         | Select-Object -First 1).FullName
          }
          if (-not $signtool) { throw "未找到 signtool.exe" }
          $exe = "dist\${{ env.APP_NAME }}-${{ matrix.target }}.exe"
          & $signtool sign /fd SHA256 /a $exe
          if ($LASTEXITCODE -ne 0) { throw "自签名失败" }
          & $signtool verify $exe
          if ($LASTEXITCODE -ne 0) {
            # 自签证书的根不在系统信任库, verify 必然报 "not trusted by the trust provider"
            # 签名本身已写入; 用户机器上同样不受信任, 故不阻断发布
            Write-Host "::warning::自签名证书未被系统信任(预期), 已签名但用户端仍会提示 SmartScreen"
            $global:LASTEXITCODE = 0
          }

      - name: 打包压缩 (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist
          name="${APP_NAME}-${{ matrix.target }}"
          if [ "${{ runner.os }}" = "macOS" ]; then
            # macOS 用 zip: 公证(notarytool)只接受 zip/dmg/pkg
            zip -q -r "$name.zip" "$name"
          else
            tar czf "$name.tar.gz" "$name"
          fi

      - name: 公证 (macOS)
        if: runner.os == 'macOS' && env.HAS_MACOS_CERT == 'true' && env.HAS_APPLE_ID == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd dist
          name="${APP_NAME}-${{ matrix.target }}"
          xcrun notarytool submit "$name.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 20m
          # zip 无法 staple 票据, 首次运行由 Gatekeeper 在线校验(需联网)
          xcrun stapler staple "$name.zip" || echo "zip 不支持 staple, 改为在线校验"

      - name: 打包压缩 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/${{ env.APP_NAME }}-${{ matrix.target }}.exe" `
            -DestinationPath "dist/${{ env.APP_NAME }}-${{ matrix.target }}.zip" -Force

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 30

  # ---------- 通用 zipapp: 任何有 Python 3.8+ 的平台都能跑(含 ppc64le/s390x/路由器/Termux 等) ----------
  zipapp:
    name: 构建 universal-py3 (zipapp)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 构建 .pyz
        run: |
          mkdir -p dist src && cp app.py src/ && cp -r web src/
          python -m zipapp src -o "dist/${APP_NAME}-universal-py3.pyz" -m "app:main" -p "/usr/bin/env python3"
          ./dist/${APP_NAME}-universal-py3.pyz --help > /dev/null && echo "冒烟测试通过"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-universal-py3
          path: dist/*.pyz
          if-no-files-found: error
          retention-days: 30

  # ---------- Linux ARMv7 32位(路由器/老 NAS), QEMU 模拟构建 ----------
  linux-armv7:
    name: 构建 linux-armv7 (实验, QEMU)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - name: armv7 容器内构建
        run: |
          # 注意: docker run 不继承宿主环境变量, APP_NAME 必须显式传入
          docker run --rm --platform linux/arm/v7 -v "$PWD":/work -w /work \
            -e APP_NAME="${APP_NAME}" -e DEBIAN_FRONTEND=noninteractive \
            arm32v7/python:3.12-slim bash -ec '
              set -e
              apt-get update -qq && apt-get install -y -qq --no-install-recommends gcc libc6-dev python3-dev
              pip install --no-cache-dir pyinstaller
              pyinstaller --onefile --clean --noconfirm --name "${APP_NAME}-linux-armv7" --add-data "web:web" app.py
              cd dist && tar czf "${APP_NAME}-linux-armv7.tar.gz" "${APP_NAME}-linux-armv7"
            '
      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux-armv7
          path: dist/*.tar.gz
          if-no-files-found: ignore
          retention-days: 30

  # ---------- Linux musl (Alpine 服务器) ----------
  linux-musl-amd64:
    name: 构建 linux-musl-amd64 (实验, Alpine)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    container:
      image: python:3.12-alpine
    steps:
      - name: 安装构建依赖
        run: apk add --no-cache git build-base binutils patchelf
      - uses: actions/checkout@v4
      - name: 构建
        run: |
          pip install --no-cache-dir pyinstaller
          pyinstaller --onefile --clean --noconfirm --name ${APP_NAME}-linux-musl-amd64 --add-data "web:web" app.py
          (cd dist && tar czf ${APP_NAME}-linux-musl-amd64.tar.gz ${APP_NAME}-linux-musl-amd64)
      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux-musl-amd64
          path: dist/*.tar.gz
          if-no-files-found: ignore
          retention-days: 30

  # ---------- FreeBSD amd64 (实验, FreeBSD 虚拟机构建) ----------
  freebsd-amd64:
    name: 构建 freebsd-amd64 (实验)
    # 必须在 x86_64 Linux 运行器上跑: Apple Silicon(macos-15) 无法启动 amd64 FreeBSD 虚拟机
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: FreeBSD 虚拟机内构建
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          sync: rsync
          copyback: true
          prepare: |
            pkg install -y gmake
          run: |
            set -e
            PY=$(command -v python3.12 || command -v python3.11 || command -v python3)
            VER=$($PY -c 'import sys; print("%d%d" % sys.version_info[:2])')
            echo "使用解释器: $PY (py$VER)"
            # FreeBSD 无 manylinux wheel, pip 需匹配当前 python 版本; 找不到时回退 ensurepip
            pkg install -y "py${VER}-pip" 2>/dev/null || $PY -m ensurepip --upgrade 2>/dev/null || true
            $PY -m pip install --upgrade pyinstaller
            $PY -m PyInstaller --onefile --clean --noconfirm \
              --name cfdata-web-manager-freebsd-amd64 --add-data "web:web" app.py
            cd dist && tar czf cfdata-web-manager-freebsd-amd64.tar.gz cfdata-web-manager-freebsd-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: bin-freebsd-amd64
          path: dist/*.tar.gz
          if-no-files-found: ignore
          retention-days: 30

  # ---------- 汇总发布: 主力矩阵全部成功后, 把所有产物发布到 GitHub Release ----------
  release:
    name: 汇总发布到 Release
    needs: [build, zipapp, linux-armv7, linux-musl-amd64, freebsd-amd64]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 汇集全部产物
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist

      - name: 生成 SHA256SUMS 与发布说明
        run: |
          cd dist
          # 对所有产物生成校验和(先于发布说明, 避免被列入文件清单)
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -exec sha256sum {} + > SHA256SUMS.txt
          ls -la
          {
            echo "## ${APP_NAME} 多平台二进制 (自动构建)"
            echo ""
            echo "- 构建来源: ${GITHUB_REPOSITORY} @ \`${GITHUB_SHA:0:7}\`"
            echo "- 主流平台已内嵌官方 [${CFDATA_REPO}](https://github.com/${CFDATA_REPO}) 同架构 cfdata, 下载即用"
            echo ""
            echo "| 产物 | 大小 |"
            echo "| --- | --- |"
            for f in *; do
              [ "$f" = "SHA256SUMS.txt" ] && continue
              printf '| %s | %s |\n' "$f" "$(du -h "$f" | cut -f1)"
            done
            echo ""
            echo "### 使用方法"
            echo ""
            echo "- **Linux / macOS / FreeBSD**: \`tar xzf cfdata-web-manager-*.tar.gz && chmod +x cfdata-web-manager-* && ./cfdata-web-manager-* --port 8088\`"
            echo "- **Windows**: 解压 zip 后双击或在终端运行 \`cfdata-web-manager-*.exe --port 8088\`"
            echo "- **universal-py3 (.pyz)**: 任何装有 Python 3.8+ 的平台: \`python3 cfdata-web-manager-universal-py3.pyz --port 8088\`"
            echo "- 运行后浏览器访问 http://127.0.0.1:8088/ ; 配置与结果保存在可执行文件同目录"
            echo ""
            echo "校验: 下载 SHA256SUMS.txt 后执行 \`sha256sum -c SHA256SUMS.txt\`"
            if [ "$HAS_GPG_KEY" = "true" ]; then
              echo "GPG 签名: SHA256SUMS.txt.asc (\`gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt\`)"
            fi
            if [ "$HAS_MACOS_CERT" = "true" ]; then
              echo "- macOS 产物已 Developer ID 签名$( [ "$HAS_APPLE_ID" = "true" ] && echo ' 并经 Apple 公证' )"
            fi
            if [ "$HAS_WINDOWS_CERT" = "true" ]; then
              echo "- Windows 产物已 Authenticode 签名"
            fi
          } > ../notes.md

      - name: GPG 签名校验文件
        if: env.HAS_GPG_KEY == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd dist
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 \
            --armor --detach-sign --output SHA256SUMS.txt.asc SHA256SUMS.txt
          gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt

      - name: 发布到 GitHub Release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            EXTRA_FLAGS=""
            TITLE="${APP_NAME} ${TAG}"
          else
            TAG="binaries"
            EXTRA_FLAGS="--prerelease"
            TITLE="多平台二进制 (最新构建)"
            echo "=== 删除旧 release ===" | tee -a ../gh.out
            gh release delete "$TAG" --cleanup-tag -y 2>&1 | tee -a ../gh.out || true
          fi
          echo "=== dist 内容 ===" | tee -a ../gh.out
          ls -la | tee -a ../gh.out
          set +e
          gh release create "$TAG" ./* --title "$TITLE" --notes-file ../notes.md $EXTRA_FLAGS 2>&1 | tee -a ../gh.out
          ec=${PIPESTATUS[0]}
          echo "gh exit=$ec" | tee -a ../gh.out
          exit $ec

      - name: 写入构建摘要
        run: |
          echo "## 多平台二进制构建完成 ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 产物 | 大小 |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          cd dist
          for f in *; do
            printf '| %s | %s |\n' "$f" "$(du -h "$f" | cut -f1)" >> $GITHUB_STEP_SUMMARY
          done
