name: Debug FreeBSD

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: FreeBSD 内诊断
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          sync: rsync
          copyback: true
          run: |
            {
              echo "=== uname ==="
              uname -a
              echo "=== 安装依赖 ==="
              pkg install -y gmake 2>&1 | tail -5
              echo "gmake exit=$?"
              pkg install -y python311 py311-pip 2>&1 | tail -8
              echo "python311 exit=$?"
              PY=$(command -v python3.12 || command -v python3.11 || command -v python3)
              echo "PY=$PY"
              $PY -V
              echo "=== pip install pyinstaller ==="
              $PY -m pip install --upgrade pyinstaller 2>&1 | tail -25
              echo "pip exit=$?"
              echo "=== PyInstaller 构建 ==="
              $PY -m PyInstaller --onefile --clean --noconfirm --name cfdata-web-manager-freebsd-amd64 --add-data "web:web" app.py 2>&1 | tail -30
              echo "build exit=$?"
              echo "=== dist ==="
              ls -la dist 2>&1
            } > diag-freebsd.log 2>&1 || true

      - name: 推送诊断
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-diag-freebsd
          git add -f diag-freebsd.log
          git commit -m "diag: freebsd $(date -u +%FT%TZ)" || exit 0
          git push -f origin ci-diag-freebsd
