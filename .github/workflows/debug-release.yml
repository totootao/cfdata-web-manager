name: Debug Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: cfdata-web-manager
  CFDATA_REPO: PoemMisty/CFData-WEB

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 复刻真实发布流程
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_TYPE: branch
        run: |
          mkdir -p dist && cd dist
          # 模拟产物: 含一个 20MB 大文件
          echo a > cfdata-web-manager-linux-amd64.tar.gz
          echo b > cfdata-web-manager-windows-amd64.zip
          echo c > cfdata-web-manager-universal-py3.pyz
          dd if=/dev/zero of=cfdata-web-manager-big.tar.gz bs=1M count=20 status=none
          {
            echo "=== 步骤3: 生成 SHA256SUMS 与发布说明 ==="
            find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -exec sha256sum {} + > SHA256SUMS.txt
            echo "sha256 生成 exit=$?"
            ls -la
            {
              echo "## ${APP_NAME} 多平台二进制 (自动构建)"
              echo ""
              echo "- 构建来源: ${GITHUB_REPOSITORY} @ \`${GITHUB_SHA:0:7}\`"
              echo "- 主流平台已内嵌官方 [${CFDATA_REPO}](https://github.com/${CFDATA_REPO}) 同架构 cfdata, 下载即用"
              echo ""
              echo "| 产物 | 大小 |"
              echo "| --- | --- |"
              for f in *; do
                [ "$f" = "SHA256SUMS.txt" ] && continue
                printf '| %s | %s |\n' "$f" "$(du -h "$f" | cut -f1)"
              done
            } > ../notes.md
            echo "notes 生成 exit=$?; notes 大小: $(wc -c < ../notes.md)"
            echo "=== 步骤4: 发布 ==="
            if [ "$GITHUB_REF_TYPE" = "tag" ]; then
              TAG="$GITHUB_REF_NAME"; EXTRA_FLAGS=""; TITLE="${APP_NAME} ${TAG}"
            else
              TAG="binaries"; EXTRA_FLAGS="--prerelease"; TITLE="多平台二进制 (最新构建)"
              gh release delete "$TAG" --cleanup-tag -y 2>&1 || echo "delete 失败(可忽略)"
            fi
            echo "TAG=$TAG EXTRA_FLAGS=$EXTRA_FLAGS"
            gh release create "$TAG" ./* --title "$TITLE" --notes-file ../notes.md $EXTRA_FLAGS 2>&1
            echo "create exit=$?"
            echo "=== 复核 ==="
            gh release view "$TAG" 2>&1 | head -5
          } > ../gh.log 2>&1 || true
          cd ..
          cat gh.log

      - name: 推送诊断
        if: always()
        run: |
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-diag
          git add -f gh.log
          git commit -m "diag: release $(date -u +%FT%TZ)"
          git push -f origin ci-diag
